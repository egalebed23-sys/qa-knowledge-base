<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<title>QA Senior · Тест по теории</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one reading column like the knowledge base itself — chapter rail on top,
     a single question card, feedback directly under the answer. Palette and faces
     are the base's own (dark only, Manrope + JetBrains Mono), so the test reads as part of it. */
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface-2: #12151d;
    --line: #252830;
    --line-strong: #343846;
    --text: #e8eaf0;
    --muted: #8a8fa2;
    --muted-2: #5f6477;
    --accent: #005bff;
    --accent-soft: rgba(0, 91, 255, 0.16);
    --link: #7fb0ff;
    --ok: #00c9a7;
    --ok-soft: rgba(0, 201, 167, 0.12);
    --bad: #ff6b35;
    --bad-soft: rgba(255, 107, 53, 0.12);
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --radius: 10px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    font-family: var(--font-mono);
    font-size: 0.86em;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }

  .page {
    max-width: 820px;
    margin: 0 auto;
    padding-block: 36px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 22px;
  }

  /* ── header ── */
  .head { display: grid; gap: 6px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow a { color: var(--muted); }
  h1 {
    margin: 0;
    font-size: clamp(24px, 4.2vw, 32px);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }

  /* ── chapter rail ── */
  .rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: 600 13px/1.2 var(--font-ui);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .chip .num { font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .chip[aria-pressed="true"] .num { color: var(--link); }
  .chip .mark { font-family: var(--font-mono); font-size: 11px; }
  .chip .mark.full { color: var(--ok); }
  .chip .mark.part { color: var(--bad); }

  /* ── progress ── */
  .status {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .status .count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
  .status .tally { display: flex; gap: 14px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tally .ok { color: var(--ok); }
  .tally .bad { color: var(--bad); }
  .tools { display: flex; gap: 14px; align-items: center; }
  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: 600 13px var(--font-ui); color: var(--muted);
  }
  .link-btn:hover { color: var(--text); }
  .link-btn[aria-pressed="true"] { color: var(--link); }
  .bar { height: 4px; background: var(--surface); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.25s ease; }

  /* ── question card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(18px, 3.5vw, 28px);
    display: grid;
    gap: 18px;
    min-width: 0;
  }
  .card .where { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
  .q {
    margin: 0;
    font-size: clamp(17px, 2.6vw, 19px);
    line-height: 1.5;
    font-weight: 700;
    text-wrap: pretty;
  }
  .hint { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--link); }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: start;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: 500 15px/1.5 var(--font-ui);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--line-strong); }
  .opt .key {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font: 600 12px var(--font-mono);
    color: var(--muted);
  }
  .opt .txt { min-width: 0; }
  .opt .verdict { font: 600 12px/26px var(--font-mono); white-space: nowrap; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .key { border-color: var(--accent); color: var(--text); background: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.is-ok .key { border-color: var(--ok); background: var(--ok); color: var(--bg); }
  .opt.is-ok .verdict { color: var(--ok); }
  .opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
  .opt.is-bad .key { border-color: var(--bad); background: var(--bad); color: var(--bg); }
  .opt.is-bad .verdict { color: var(--bad); }
  .opt.is-missed { border-style: dashed; border-color: var(--ok); }
  .opt.is-missed .verdict { color: var(--ok); }
  .opt.is-dim { opacity: 0.55; }

  .why {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: grid;
    gap: 8px;
  }
  .why .verdict-line { font-weight: 800; font-size: 15px; }
  .why .verdict-line.ok { color: var(--ok); }
  .why .verdict-line.bad { color: var(--bad); }
  .why p { margin: 0; color: var(--text); max-width: 68ch; }
  .why .src { font-size: 13px; }

  .nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
  .nav .right { display: flex; gap: 10px; margin-left: auto; }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--text);
    font: 700 14px var(--font-ui);
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #1f6dff; border-color: #1f6dff; }
  .keys { font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); }

  /* ── results ── */
  .score {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;
  }
  .score .big { font: 800 clamp(40px, 8vw, 56px)/1 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .score .of { font: 600 18px var(--font-mono); color: var(--muted); }
  .score .pct { font: 600 14px var(--font-mono); color: var(--muted); }
  .chapters { display: grid; gap: 12px; }
  .crow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 140px 64px;
    gap: 14px;
    align-items: center;
    font-size: 14px;
  }
  .crow .name { min-width: 0; }
  .crow .name .num { font-family: var(--font-mono); font-size: 11px; color: var(--muted-2); margin-right: 6px; }
  .crow .track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .crow .track > span { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
  .crow.weak .track > span { background: var(--bad); }
  .crow .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
  .crow.weak .val { color: var(--bad); }
  .note { margin: 0; color: var(--muted); font-size: 14px; max-width: 68ch; }

  @media (max-width: 520px) {
    .crow { grid-template-columns: minmax(0, 1fr) 64px; }
    .crow .track { grid-column: 1 / -1; order: 3; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<main class="page">
  <header class="head">
    <div class="eyebrow"><a href="index.html">QA Senior</a> / <a href="theory.html">Теория тестирования</a></div>
    <h1>Тест по теории тестирования</h1>
    <p class="sub" id="sub">Главы 01–10 · проверка сразу после ответа, объяснение и ссылка на раздел базы</p>
  </header>

  <nav class="rail" id="rail" aria-label="Главы"></nav>

  <div class="status">
    <span><span class="count" id="count"></span></span>
    <span class="tally" id="tally"></span>
    <span class="tools">
      <button class="link-btn" id="shuffle" type="button" aria-pressed="false">Перемешать вопросы</button>
      <button class="link-btn" id="reset" type="button">Начать заново</button>
    </span>
  </div>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>

  <section id="stage" aria-live="polite"></section>
</main>

<script>
const KB = "theory.html#";
const CH = [
  { n: 1,  id: "what-is-testing", t: "Что такое тестирование",        s: "Тестирование" },
  { n: 2,  id: "qa-qc",           t: "QA vs QC vs Testing",           s: "QA и QC" },
  { n: 3,  id: "sdlc",            t: "SDLC, STLC и роль QA",          s: "Процесс" },
  { n: 4,  id: "types",           t: "Виды тестирования",             s: "Виды" },
  { n: 5,  id: "levels",          t: "Уровни тестирования",           s: "Уровни" },
  { n: 6,  id: "pyramid",         t: "Пирамида тестирования",         s: "Пирамида" },
  { n: 7,  id: "design",          t: "Техники тест-дизайна",          s: "Тест-дизайн" },
  { n: 8,  id: "docs",            t: "Тестовая документация",         s: "Документация" },
  { n: 9,  id: "practice",        t: "Дизайн тест-кейсов: практика",  s: "Практика" },
  { n: 10, id: "bug-life",        t: "Жизненный цикл бага",           s: "Баги" },
];

/* ok — индексы верных вариантов; два и больше = вопрос с несколькими ответами */
const Q = [
  // 01 — что такое тестирование
  { ch: 1, q: "Какое определение тестирования база считает сильным ответом на собесе?",
    o: ["Поиск как можно большего числа багов до релиза",
        "Сбор информации о качестве продукта для принятия решений",
        "Доказательство того, что в продукте нет дефектов",
        "Проверка, что всё работает по ТЗ"],
    ok: [1], ex: "Сильное определение дают через цель, а не через действие: по данным тестирования команда и бизнес решают — релизить, доделать или откатить. «Искать баги» и «проверять, что всё работает» описывают действие, а доказать отсутствие дефектов тестирование не может в принципе." },
  { ch: 1, q: "Что тестирование НЕ делает? Выбери все верные.",
    o: ["Не доказывает отсутствие дефектов",
        "Не принимает решение о релизе само",
        "Не оценивает риски",
        "Не «создаёт качество» — его закладывают при разработке"],
    ok: [0, 1, 3], ex: "Оценивать риски — как раз работа тестирования. А вот убирать их будет разработка, решение о релизе принимает команда, и качество закладывается при разработке, а не «добавляется» проверками." },
  { ch: 1, q: "Какой из принципов ISTQB называют pesticide paradox?",
    o: ["Большая часть дефектов скапливается в немногих модулях",
        "Одни и те же тесты со временем находят всё меньше новых дефектов, поэтому тесты надо обновлять",
        "Исчерпывающее тестирование невозможно",
        "Тестирование зависит от контекста"],
    ok: [1], ex: "Pesticide paradox — тесты «изнашиваются»: что ловило баги вчера, сегодня их уже не ловит. Скопление дефектов (defect clustering) — отдельный принцип: дефекты концентрируются в небольшом числе модулей. Это два разных пункта из семи." },
  { ch: 1, q: "Форма регистрации: 5 полей, у каждого 10 валидных значений. Сколько комбинаций и какой из этого вывод?",
    o: ["50 — проверить можно всё",
        "10⁵ = 100 000 — полное тестирование невозможно, нужен выбор по риску",
        "5¹⁰ — все комбинации надо автоматизировать",
        "100 — хватит pairwise без анализа рисков"],
    ok: [1], ex: "10 значений в 5 полях — это 10⁵ комбинаций, а с браузерами, сетью и порядком ввода их ещё больше. Работа QA — не «проверить всё», а выбрать, что проверять. Это и есть risk-based мышление." },
  { ch: 1, q: "«Разработчик пишет чистый код и unit-тесты. Зачем тогда QA?» Какой ответ сильнее?",
    o: ["Unit-тесты разработчика не считаются тестированием",
        "Качество кода ≠ качество продукта: фича может не решать задачу пользователя, не стыковаться с соседним сервисом, падать под нагрузкой или нарушать закон",
        "QA нужен, чтобы перепроверять unit-тесты",
        "Без QA нельзя пройти аудит"],
    ok: [1], ex: "QA смотрит на продукт глазами пользователя и бизнеса. Идеальный код всё ещё может делать не то, не дружить с соседями, ронять систему под нагрузкой или нарушать GDPR." },

  // 02 — QA vs QC
  { ch: 2, q: "Настройка CI/CD, правила код-ревью, стандарты кода и линтеры — это…",
    o: ["QA — обеспечение качества", "QC — контроль качества", "Testing", "Validation"],
    ok: [0], ex: "QA — про процесс и превентивен: ревью требований, стандарты, CI, обучение команды. QC — про продукт и реактивен: прогон тестов, регресс, проверка фикса. Testing — сами действия внутри QC." },
  { ch: 2, q: "«Are we building the right product?» — это вопрос…",
    o: ["Verification", "Validation", "Quality Control", "Smoke-тестирования"],
    ok: [1], ex: "Validation — тот ли продукт вообще нужен: UAT, демо заказчику, usability, обратная связь пользователей. Verification — are we building the product right: соответствие спецификации, ревью, тесты по критериям приёмки." },
  { ch: 2, q: "Что относится к QC, то есть к реактивной части? Выбери все верные.",
    o: ["Прогон регресса", "Проверка фикса", "Ревью требований", "Баг-репорты"],
    ok: [0, 1, 3], ex: "Ревью требований — превентивная работа, это QA. Регресс, проверка фикса и баг-репорты относятся к QC: они про уже сделанный продукт." },
  { ch: 2, q: "«QA — это часть разработки или отдельная функция?»",
    o: ["Отдельный отдел приёмки, независимый от разработки",
        "Часть разработки: за качество отвечает вся команда, QA — фасилитатор",
        "Часть продуктового менеджмента",
        "Зависит от того, есть ли автотесты"],
    ok: [1], ex: "За качество отвечает вся команда, QA внутри неё. В продуктовых командах это называют Quality Engineering: инженер пишет тесты как код, ревьюит PR и отвечает за CI наравне с фичами." },

  // 03 — SDLC, STLC, Scrum, Kanban, оценка
  { ch: 3, q: "Что из этого входит в Definition of Ready, а не в Definition of Done?",
    o: ["Код прошёл ревью", "Критерии приёмки понятны", "Документация обновлена", "Изменения смержены в main"],
    ok: [1], ex: "DoR отвечает, можно ли брать задачу в работу: описана, оценена, зависимости разрешены, критерии приёмки понятны. DoD — можно ли считать её завершённой: ревью, тесты, мерж, документация." },
  { ch: 3, q: "На какой церемонии Scrum у QA главная точка влияния?",
    o: ["Daily", "Refinement", "Review", "Retro"],
    ok: [1], ex: "На рефайнменте QA задаёт вопросы к требованиям до того, как написан код, и это дешевле всего. На Review искать баги уже поздно: если они всплывают на демо, процесс сломан раньше." },
  { ch: 3, q: "Что превращает доску с колонками в Kanban?",
    o: ["Колонки To Do / In Progress / Done",
        "WIP-лимиты на колонки и управление потоком по метрикам",
        "Спринты по две недели",
        "Отдельная роль Kanban-мастера"],
    ok: [1], ex: "Без WIP-лимитов и замера времени прохождения задач «канбан-доска» — просто список задач. Kanban управляет потоком через ограничение незавершённой работы." },
  { ch: 3, q: "Чем lead time отличается от cycle time?",
    o: ["Lead time — от заявки до прода, cycle time — от «взяли в работу» до готово",
        "Lead time — от «взяли в работу» до готово, cycle time — от заявки до прода",
        "Это одно и то же",
        "Lead time — сколько задач закрыли за неделю"],
    ok: [0], ex: "Lead time — то, что чувствует заказчик. Cycle time — скорость самой команды. Сколько задач закрыли за неделю — это throughput." },
  { ch: 3, q: "Оценка по трём точкам (PERT): оптимистично 2 дня, реально 4, пессимистично 12. Что получится?",
    o: ["4 дня", "5 дней", "6 дней", "12 дней"],
    ok: [1], ex: "Формула (O + 4·M + P) / 6 = (2 + 16 + 12) / 6 = 5. Простое среднее трёх точек дало бы 6. Отвечать при этом стоит диапазоном с допущениями, а не одним числом." },
  { ch: 3, q: "Что чаще всего забывают включить в оценку тестирования? Выбери все верные.",
    o: ["Ретест и регресс после фиксов",
        "Подготовку тестовых данных и окружения",
        "Буфер на неизвестное, названный вслух",
        "Время разработчика на unit-тесты"],

    ok: [2], ex: "Это ловушка. Отвечают по шагам: стабилизировать, разобрать по «5 почему», предложить одно изменение процесса. Разбор без поиска виноватого — механика: иначе люди перестанут приносить инциденты." },
];

/* ────────────── state ────────────── */
const KEY = "theory-quiz-v1";
const LETTERS = "ABCDEFG";
let state;

function freshState() {
  return { filter: 0, shuffle: false, mode: "all", order: [], pos: 0, answers: {}, perm: {} };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); return s && typeof s === "object" ? s : {}; }
  catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: work without it */ }
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pool() {
  const idx = Q.map((_, i) => i).filter(i => !state.filter || Q[i].ch === state.filter);
  return state.shuffle ? shuffled(idx) : idx;
}
function buildOrder(keepPos) {
  state.mode = "all";
  state.order = pool();
  if (!keepPos) {
    const first = state.order.findIndex(i => !state.answers[i]);
    state.pos = first === -1 ? state.order.length : first;
  }
}
function permFor(i) {
  if (!state.perm[i]) state.perm[i] = shuffled(Q[i].o.map((_, k) => k));
  return state.perm[i];
}
const isMulti = i => Q[i].ok.length > 1;
function sameSet(a, b) { return a.length === b.length && a.every(x => b.includes(x)); }

/* ────────────── rendering ────────────── */
const $ = id => document.getElementById(id);

function renderRail() {
  const rail = $("rail");
  const chips = [{ n: 0, s: "Все главы" }].concat(CH);
  rail.innerHTML = chips.map(c => {
    const qs = Q.map((q, i) => i).filter(i => !c.n || Q[i].ch === c.n);
    const done = qs.filter(i => state.answers[i]).length;
    const right = qs.filter(i => state.answers[i] && state.answers[i].ok).length;
    let mark = "";
    if (c.n && done === qs.length) mark = `<span class="mark ${right === qs.length ? "full" : "part"}">${right}/${qs.length}</span>`;
    const num = c.n ? `<span class="num">${String(c.n).padStart(2, "0")}</span>` : "";
    const title = c.n ? ` title="${c.t}"` : "";
    return `<button class="chip" type="button" data-ch="${c.n}" aria-pressed="${state.filter === c.n}"${title}>${num}${c.s}${mark}</button>`;
  }).join("");
}

function renderStatus() {
  const total = state.order.length;
  const answered = state.order.filter(i => state.answers[i]).length;
  const right = state.order.filter(i => state.answers[i] && state.answers[i].ok).length;
  const label = state.mode === "mistakes" ? "Работа над ошибками · " : "";
  const shown = Math.min(state.pos + 1, total);
  $("count").textContent = state.pos >= total ? `${label}Итог · ${total} ${plural(total, "вопрос", "вопроса", "вопросов")}` : `${label}Вопрос ${shown} из ${total}`;
  $("tally").innerHTML = `<span class="ok">верно ${right}</span><span class="bad">ошибок ${answered - right}</span>`;
  $("bar").style.width = total ? `${(answered / total) * 100}%` : "0%";
  $("shuffle").setAttribute("aria-pressed", String(state.shuffle));
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function renderQuestion() {
  const i = state.order[state.pos];
  const q = Q[i];
  const ch = CH[q.ch - 1];
  const multi = isMulti(i);
  const ans = state.answers[i];
  const sel = ans ? ans.sel : (state.draft && state.draft.q === i ? state.draft.sel : []);
  const perm = permFor(i);

  const opts = perm.map((orig, k) => {
    let cls = "opt", verdict = "";
    if (ans) {
      const chosen = ans.sel.includes(orig), right = q.ok.includes(orig);
      if (chosen && right) { cls += " is-ok"; verdict = "верно"; }
      else if (chosen && !right) { cls += " is-bad"; verdict = "мимо"; }
      else if (!chosen && right) { cls += multi ? " is-missed" : " is-ok"; verdict = multi ? "пропущен" : "верный"; }
      else cls += " is-dim";
    }
    const pressed = !ans && sel.includes(orig);
    return `<button class="${cls}" type="button" data-orig="${orig}" aria-pressed="${pressed}" ${ans ? "disabled" : ""}>
      <span class="key">${LETTERS[k]}</span><span class="txt">${q.o[orig]}</span><span class="verdict">${verdict}</span></button>`;
  }).join("");

  let why = "";
  if (ans) {
    const rightLetters = perm.map((orig, k) => q.ok.includes(orig) ? LETTERS[k] : null).filter(Boolean).join(", ");
    why = `<div class="why">
      <div class="verdict-line ${ans.ok ? "ok" : "bad"}">${ans.ok ? "Верно" : `Неверно · правильный ответ: ${rightLetters}`}</div>
      <p>${q.ex}</p>
      <a class="src" href="${KB}${ch.id}" target="_blank" rel="noopener">Открыть раздел ${String(ch.n).padStart(2, "0")} «${ch.t}» в базе ↗</a>
    </div>`;
  }

  const last = state.pos === state.order.length - 1;
  const nextLabel = last ? "Показать итог" : "Дальше";
  const action = !ans && multi
    ? `<button class="btn primary" type="button" id="check" ${sel.length ? "" : "disabled"}>Проверить</button>`
    : `<button class="btn primary" type="button" id="next" ${ans ? "" : "disabled"}>${nextLabel} →</button>`;

  $("stage").innerHTML = `<article class="card">
    <div class="where">
      <a class="eyebrow" href="${KB}${ch.id}" target="_blank" rel="noopener">§${String(ch.n).padStart(2, "0")} · ${ch.t}</a>
      ${multi ? `<span class="hint">Несколько верных ответов</span>` : ""}
    </div>
    <h2 class="q">${q.q}</h2>
    <div class="opts" role="group" aria-label="Варианты ответа">${opts}</div>
    ${why}
    <div class="nav">
      <button class="btn" type="button" id="prev" ${state.pos === 0 ? "disabled" : ""}>← Назад</button>
      <span class="keys">клавиши 1–${perm.length} · Enter</span>
      <div class="right">${action}</div>
    </div>
  </article>`;
}

function renderResults() {
  const total = state.order.length;
  const right = state.order.filter(i => state.answers[i] && state.answers[i].ok).length;
  const wrong = state.order.filter(i => state.answers[i] && !state.answers[i].ok);
  const pct = total ? Math.round((right / total) * 100) : 0;
  const chs = CH.filter(c => state.order.some(i => Q[i].ch === c.n));
  const rows = chs.map(c => {
    const qs = state.order.filter(i => Q[i].ch === c.n);
    const r = qs.filter(i => state.answers[i] && state.answers[i].ok).length;
    const share = qs.length ? r / qs.length : 0;
    const weak = share < 0.7;
    return `<div class="crow ${weak ? "weak" : ""}">
      <span class="name"><span class="num">${String(c.n).padStart(2, "0")}</span>${weak ? `<a href="${KB}${c.id}" target="_blank" rel="noopener">${c.t} ↗</a>` : c.t}</span>
      <span class="track"><span style="width:${share * 100}%"></span></span>
      <span class="val">${r}/${qs.length}</span>
    </div>`;
  }).join("");
  const weakCount = chs.filter(c => {
    const qs = state.order.filter(i => Q[i].ch === c.n);
    return qs.filter(i => state.answers[i] && state.answers[i].ok).length / qs.length < 0.7;
  }).length;

  $("stage").innerHTML = `<article class="card">
    <div class="eyebrow">${state.mode === "mistakes" ? "Итог работы над ошибками" : "Итог"}</div>
    <div class="score"><span class="big">${right}</span><span class="of">из ${total}</span><span class="pct">${pct}%</span></div>
    <div class="chapters">${rows}</div>
    <p class="note">${weakCount ? "Красным отмечены главы, где верных ответов меньше 70% — название ведёт в нужный раздел базы." : "Все главы выше 70%. Для закрепления пройди тест ещё раз с перемешанными вопросами."}</p>
    <div class="nav">
      <button class="btn" type="button" id="prev">← К последнему вопросу</button>
      <div class="right">
        ${wrong.length ? `<button class="btn primary" type="button" id="mistakes">Повторить ошибки (${wrong.length})</button>` : ""}
        <button class="btn ${wrong.length ? "" : "primary"}" type="button" id="again">Пройти заново</button>
      </div>
    </div>
  </article>`;
}

function render() {
  if (!state.order.length) buildOrder(false);
  renderRail();
  renderStatus();
  if (state.pos >= state.order.length) renderResults(); else renderQuestion();
  save();
}

/* ────────────── actions ────────────── */
function pick(orig) {
  const i = state.order[state.pos];
  if (state.answers[i]) return;
  if (!isMulti(i)) {
    state.answers[i] = { sel: [orig], ok: Q[i].ok.includes(orig) && Q[i].ok.length === 1 };
    state.draft = null;
  } else {
    const cur = state.draft && state.draft.q === i ? state.draft.sel.slice() : [];
    const at = cur.indexOf(orig);
    if (at >= 0) cur.splice(at, 1); else cur.push(orig);
    state.draft = { q: i, sel: cur };
  }
  render();
}
function check() {
  const i = state.order[state.pos];
  const sel = state.draft && state.draft.q === i ? state.draft.sel : [];
  if (!sel.length || state.answers[i]) return;
  state.answers[i] = { sel: sel.slice(), ok: sameSet(sel, Q[i].ok) };
  state.draft = null;
  render();
}
function next() {
  const i = state.order[state.pos];
  if (i !== undefined && !state.answers[i]) return;
  state.pos = Math.min(state.pos + 1, state.order.length);
  render();
  $("stage").scrollIntoView({ block: "nearest" });
}
function prev() {
  state.pos = Math.max(0, Math.min(state.pos, state.order.length) - 1);
  state.draft = null;
  render();
}
function setFilter(n) {
  state.filter = n;
  state.draft = null;
  buildOrder(false);
  render();
}
function mistakes() {
  const wrong = state.order.filter(i => state.answers[i] && !state.answers[i].ok);
  wrong.forEach(i => { delete state.answers[i]; delete state.perm[i]; });
  state.order = state.shuffle ? shuffled(wrong) : wrong;
  state.mode = "mistakes";
  state.pos = 0;
  state.draft = null;
  render();
}
function restart() {
  const keepShuffle = state.shuffle, keepFilter = state.filter;
  state = freshState();
  state.shuffle = keepShuffle;
  state.filter = keepFilter;
  buildOrder(false);
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.classList.contains("chip")) return setFilter(Number(t.dataset.ch));
  if (t.classList.contains("opt")) return pick(Number(t.dataset.orig));
  switch (t.id) {
    case "check": return check();
    case "next": return next();
    case "prev": return prev();
    case "mistakes": return mistakes();
    case "again": case "reset": return restart();
    case "shuffle": state.shuffle = !state.shuffle; buildOrder(false); return render();
  }
});

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;   // не перехватывать ввод в окне поиска
  if (state.pos >= state.order.length) return;
  const i = state.order[state.pos];
  const perm = permFor(i);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= perm.length) { e.preventDefault(); return pick(perm[n - 1]); }
  if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) {
    e.preventDefault();
    if (!state.answers[i] && isMulti(i)) return check();
    return next();
  }
  if (e.key === "ArrowRight" && state.answers[i]) return next();
  if (e.key === "ArrowLeft") return prev();
});

function start(saved) {
  state = Object.assign(freshState(), load(), saved && saved.order ? saved : {});
  const valid = i => Number.isInteger(i) && i >= 0 && i < Q.length;
  state.order = (state.order || []).filter(valid);
  render();
}
start(null);
</script>
<script src="search.js" defer></script>
</body>
</html>
